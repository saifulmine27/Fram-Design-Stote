<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frame – Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@400;700;800&family=Space+Grotesk:wght@400;600;700&family=Bebas+Neue&family=Caveat:wght@500;700&family=Poppins:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&family=Pacifico&family=Anton&family=Dancing+Script:wght@600;700&family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e6e9f0;
  --panel: #ffffff;
  --ink: #16182a;
  --mute: #6b7087;
  --line: #dde0ea;
  --acc: #5b3df5;
  --accs: #ece8ff;
  --field: #f3f4f8;
  --r: 16px;
  --sh: 0 1px 2px rgba(20,20,60,.05), 0 10px 30px rgba(20,20,60,.09);
  --acc2: #ff5fa2;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --bg: #0d0f18;
  --panel: #171a27;
  --ink: #eceef8;
  --mute: #9298b3;
  --line: #2a2e42;
  --acc: #8f7aff;
  --accs: #2b2552;
  --field: #20243a;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
html, body {
  height: 100%;
  margin: 0;
}
body {
  font: 13px/1.4 "Plus Jakarta Sans", system-ui, sans-serif;
  background: radial-gradient(900px 480px at 8% -8%, color-mix(in srgb, var(--acc) 16%, transparent), transparent),
              radial-gradient(800px 420px at 100% 0, color-mix(in srgb, var(--acc2) 12%, transparent), transparent),
              var(--bg);
  color: var(--ink);
  overflow: hidden;
}
#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
}
header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  margin: 10px 12px 0;
  height: 54px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -.02em;
  margin-right: 10px;
}
.logo i {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, #5b3df5, #ff5fa2);
  display: block;
  position: relative;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--acc) 45%, transparent);
}
.logo i:after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 2px solid #fff;
  border-radius: 3px;
}
.sp { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn {
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  font-weight: 600;
  transition: transform .15s, box-shadow .15s, background .15s;
}
.btn:hover { border-color: var(--line); transform: translateY(-1px); box-shadow: var(--sh); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 1px;
}
.btn.pri {
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  color: #fff;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--acc) 40%, transparent);
}
.zl { min-width: 44px; text-align: center; color: var(--mute); font-weight: 600; }
main {
  display: grid;
  grid-template-columns: 300px 1fr 300px;
  gap: 12px;
  padding: 10px 12px 12px;
  min-height: 0;
}
aside {
  background: var(--panel);
  overflow: auto;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
}
h3 {
  margin: 18px 0 8px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  color: var(--mute);
}
h3:first-child { margin-top: 0; }
#tabs {
  position: sticky;
  top: -14px;
  z-index: 5;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  background: var(--panel);
  padding: 14px 0 10px;
  margin: -14px 0 4px;
}
#tabs button {
  flex: 1;
  min-width: 52px;
  border: 0;
  border-radius: 10px;
  padding: 8px 4px;
  background: var(--field);
  color: var(--mute);
  font-weight: 700;
  font-size: 11.5px;
  cursor: pointer;
  transition: .15s;
}
#tabs button:hover { color: var(--ink); }
#tabs button.on {
  background: var(--acc);
  color: #fff;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--acc) 40%, transparent);
}
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
  aspect-ratio: 1;
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.tile:hover { border-color: var(--acc); transform: translateY(-2px); box-shadow: var(--sh); }
.tile i { display: block; width: 24px; height: 24px; background: var(--ink); }
.txt {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.txt:hover { border-color: var(--acc); }
.tpls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tp {
  height: 64px;
  border-radius: 10px;
  border: 1px solid var(--line);
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  color: #fff;
  display: flex;
  align-items: flex-end;
  padding: 6px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.tp:hover { transform: translateY(-2px); box-shadow: var(--sh); }
#tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; align-items: start; }
.th {
  position: relative;
  container-type: inline-size;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--line);
  width: 100%;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.th:hover { transform: translateY(-2px); box-shadow: var(--sh); border-color: var(--acc); }
.th * { position: absolute; pointer-events: none; white-space: pre-wrap; }
.stk-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--field);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.stk-card:hover { transform: translateY(-2px); box-shadow: var(--sh); outline: 2px solid var(--acc); }
.stk-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.stk-lbl {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: linear-gradient(transparent, rgba(12,14,26,.82));
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  padding: 8px 5px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
.stk-cats { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 6px; }
.stk-cat {
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--mute);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
}
.stk-cat.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
select, input[type=number], input[type=text], input[type=url], textarea {
  width: 100%;
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 6px 8px;
}
input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; cursor: pointer; }
input[type=range] { width: 100%; accent-color: var(--acc); }
.f { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
.f span { color: var(--mute); font-weight: 600; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
#view {
  position: relative;
  overflow: auto;
  display: flex;
  min-height: 0;
  padding: 36px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background-color: color-mix(in srgb, var(--bg) 60%, var(--panel));
  background-image: radial-gradient(color-mix(in srgb, var(--mute) 35%, transparent) 1px, transparent 1.3px);
  background-size: 20px 20px;
}
#wrap { position: relative; margin: auto; flex: none; }
#stage {
  position: absolute;
  left: 0; top: 0;
  transform-origin: 0 0;
  box-shadow: 0 20px 60px rgba(20,20,60,.28), 0 0 0 1px rgba(0,0,0,.06);
  overflow: visible;
}
#clip { position: absolute; inset: 0; overflow: hidden; }
#clip.grid::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(rgba(127,127,127,.45) calc(1px/var(--z)), transparent 0),
                    linear-gradient(90deg, rgba(127,127,127,.45) calc(1px/var(--z)), transparent 0);
  background-size: 8.3333% 8.3333%;
}
.el { position: absolute; touch-action: none; user-select: none; cursor: move; transform-origin: 50% 50%; }
.el img { pointer-events: none; user-select: none; -webkit-user-drag: none; }
.el.text { white-space: pre-wrap; word-break: break-word; }
.el[contenteditable=true] { user-select: text; outline: calc(2px/var(--z)) solid var(--acc); outline-offset: calc(3px/var(--z)); cursor: text; background: rgba(91, 61, 245, 0.06); }
.el.ms { outline: calc(2px/var(--z)) dashed var(--acc); outline-offset: calc(2px/var(--z)); }
#mq { position: absolute; border: calc(1.5px/var(--z)) solid var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); pointer-events: none; }
#selbox { position: absolute; display: none; pointer-events: none; border: calc(2px/var(--z)) solid var(--acc); transform-origin: 50% 50%; }
.h {
  position: absolute;
  width: calc(13px/var(--z));
  height: calc(13px/var(--z));
  background: #fff;
  border: calc(2px/var(--z)) solid var(--acc);
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.h[data-k=nw] { left: 0; top: 0; transform: translate(-50%, -50%); cursor: nwse-resize; }
.h[data-k=ne] { left: 100%; top: 0; transform: translate(-50%, -50%); cursor: nesw-resize; }
.h[data-k=se] { left: 100%; top: 100%; transform: translate(-50%, -50%); cursor: nwse-resize; }
.h[data-k=sw] { left: 0; top: 100%; transform: translate(-50%, -50%); cursor: nesw-resize; }
.h[data-k=rot] { left: 50%; top: calc(-36px/var(--z)); transform: translate(-50%, -50%); cursor: grab; background: var(--acc); }
.g { position: absolute; background: #ff3d8b; display: none; pointer-events: none; }
#gv { top: 0; bottom: 0; width: calc(1.5px/var(--z)); left: 50%; }
#gh { left: 0; right: 0; height: calc(1.5px/var(--z)); top: 50%; }
.ly { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.ly:hover { background: var(--field); }
.ly.on { background: var(--accs); border-color: var(--acc); }
.ly b { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ly button { background: none; border: 0; cursor: pointer; color: var(--mute); font-size: 11px; padding: 2px 6px; border-radius: 6px; }
.ly button:hover { background: var(--field); color: var(--ink); }
#modal, #kmodal {
  position: fixed;
  inset: 0;
  background: rgba(10,10,25,.6);
  display: none;
  place-items: center;
  z-index: 60;
  padding: 20px;
  backdrop-filter: blur(6px);
}
#modal.on, #kmodal.on { display: grid; }
#modal > div, #kmodal > div {
  background: var(--panel);
  border-radius: 20px;
  padding: 18px;
  max-width: 560px;
  width: 100%;
  max-height: 100%;
  overflow: auto;
}
#modal img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; margin: 10px 0; }
.kk { display: grid; grid-template-columns: 170px 1fr; gap: 8px 12px; align-items: center; }
.kk kbd { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font: 600 12px 'Plus Jakarta Sans', sans-serif; justify-self: start; }
#ctx {
  position: fixed;
  z-index: 70;
  display: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--sh);
  padding: 6px;
  min-width: 170px;
}
#ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
#ctx button:hover { background: var(--field); }

/* Home Overlay */
#home {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  background: var(--panel);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#hmain { flex: 1; min-width: 0; overflow: auto; padding: 0; background: var(--panel); }
#hero {
  --hf: #16182a;
  --hf2: rgba(22,24,42,.66);
  --hchip: rgba(255,255,255,.7);
  --hchipb: rgba(22,24,42,.1);
  --hon: rgba(255,255,255,.8);
  --hhov: rgba(91,61,245,.08);
  --htg: rgba(91,61,245,.12);
  --htc: #5b3df5;
  --hlk: #5b3df5;
  --hmk: #5b3df5;
  --hmkc: #fff;
  --hsh: rgba(70,50,160,.25);
  --hbg: radial-gradient(520px 320px at 90% 8%, rgba(255,190,225,.6), transparent 70%),
         radial-gradient(520px 340px at 55% 105%, rgba(160,215,255,.55), transparent 70%),
         linear-gradient(135deg, #f4f2ff, #e8e2ff 55%, #ffeaf5);
  position: relative;
  margin: 12px;
  border-radius: 32px;
  overflow: hidden;
  color: var(--hf);
  padding: 18px 36px 60px;
  background: var(--hbg);
}
:root[data-theme="dark"] #hero {
  --hf: #fff;
  --hf2: rgba(255,255,255,.74);
  --hchip: rgba(255,255,255,.08);
  --hchipb: rgba(255,255,255,.22);
  --hon: rgba(255,255,255,.16);
  --hhov: rgba(255,255,255,.1);
  --htg: rgba(198,255,61,.14);
  --htc: #c6ff3d;
  --hlk: #c6ff3d;
  --hmk: #c6ff3d;
  --hmkc: #14123a;
  --hsh: rgba(0,0,0,.45);
  --hbg: radial-gradient(520px 320px at 90% 8%, rgba(255,130,190,.35), transparent 70%),
         radial-gradient(520px 340px at 55% 105%, rgba(120,200,255,.3), transparent 70%),
         linear-gradient(135deg, #2b2872, #4a3fa8 60%, #6b3f9e);
}
#hnav { position: relative; z-index: 3; display: flex; align-items: center; gap: 6px; margin-bottom: 54px; flex-wrap: wrap; }
.hlogo { display: flex; align-items: center; gap: 9px; font: 800 21px 'Plus Jakarta Sans', sans-serif; letter-spacing: -.02em; margin-right: auto; cursor: pointer; color: var(--hf); }
.hlogo i { width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(135deg, #c6ff3d, #ff5fa2); display: block; }
.rb {
  border: 0;
  background: none;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 999px;
  color: var(--hf2);
  font: 600 13px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
}
.rb svg { width: 18px; height: 18px; }
.rb:hover { background: var(--hhov); color: var(--hf); }
.rb.on { background: var(--hon); color: var(--hf); }
.rb.mk { margin-left: 8px; background: var(--hmk); color: var(--hmkc); font-weight: 800; animation: glow 2.6s ease-in-out infinite; }
.rb.mk i { font-style: normal; font-size: 18px; line-height: 1; }
.hgrid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr .95fr; gap: 24px; align-items: center; }
.htag { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--htg); color: var(--htc); font-weight: 700; font-size: 12px; letter-spacing: .04em; margin-bottom: 18px; }
#hh { text-align: left; font: 700 clamp(38px, 5vw, 66px)/1.04 'Space Grotesk', sans-serif; letter-spacing: -.03em; margin: 0 0 16px; color: var(--hf); }
#hh em { font-style: normal; background-image: linear-gradient(transparent 62%, #c6ff3dbb 62% 92%, transparent 92%); background-repeat: no-repeat; background-size: 0 100%; animation: mark .9s .8s cubic-bezier(.2,.8,.2,1) forwards; }
.hsubp { max-width: 480px; color: var(--hf2); font-size: 16px; line-height: 1.55; margin: 0 0 26px; }
#hsearch {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 560px;
  margin: 0 0 16px;
  background: #fff;
  border: 1px solid rgba(22,24,42,.08);
  border-radius: 999px;
  padding: 0 8px 0 22px;
  height: 60px;
  box-shadow: 0 12px 32px rgba(91,61,245,.14);
  color: #6b7087;
}
#hq { flex: 1; border: 0; background: none !important; outline: 0; font: inherit; font-size: 16px; padding: 0; color: #14123a; }
#hgo { border: 0; background: #2b2580; color: #fff; border-radius: 999px; padding: 12px 22px; font-weight: 700; cursor: pointer; transition: .15s; }
#hgo:hover { background: #5b3df5; }
#hchips { display: flex; justify-content: flex-start; align-items: center; flex-wrap: wrap; margin: 0 0 22px; gap: 8px; }
.hlab { color: var(--hf2); font-weight: 600; margin-right: 4px; }
.chip {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--hchipb);
  background: var(--hchip);
  color: var(--hf);
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  cursor: pointer;
}
.chip i { width: 22px; height: 22px; border-radius: 7px; display: block; }
.chip:hover { border-color: var(--hmk); }
.hlink { border: 0; background: none; color: var(--hlk); font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; padding: 0; }
.hlink:hover { text-decoration: underline; }
#hfloat {
  position: relative;
  height: 400px;
  translate: var(--px, 0px) var(--py, 0px);
  rotate: var(--pr, 0deg);
  transition: translate .35s ease-out, rotate .35s ease-out;
}
#hfloat:before {
  content: '';
  position: absolute;
  left: 26%; top: 50px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: #a78bfa;
  opacity: .16;
  filter: blur(36px);
  animation: pulse 5s ease-in-out infinite;
}
#hfloat .fc { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 50px var(--hsh); cursor: pointer; transition: transform .2s; }
#hfloat .fc:nth-child(1) { animation: fcIn .8s .1s cubic-bezier(.2,.8,.2,1) both, fcF1 6s .9s ease-in-out infinite; }
#hfloat .fc:nth-child(2) { animation: fcIn .8s .3s cubic-bezier(.2,.8,.2,1) both, fcF2 7s 1.1s ease-in-out infinite; }
#hfloat .fc:nth-child(3) { animation: fcIn .8s .5s cubic-bezier(.2,.8,.2,1) both, fcF3 5.5s 1.3s ease-in-out infinite; }
#hfloat .fc:hover { transform: translateY(-8px) rotate(0) !important; z-index: 5; animation-play-state: paused; }
#hfloat .fc .th { border: 0; border-radius: 0; width: 100%; display: block; }
.hsec { padding: 38px 24px 8px; max-width: 1280px; margin: 0 auto; }
.hsec h2 { font: 700 27px 'Space Grotesk', sans-serif; letter-spacing: -.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 12px; }
.hsub { color: var(--mute); margin: 0 0 18px; }
#hclr { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: 600 12px 'Plus Jakarta Sans'; cursor: pointer; }
#hcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin: 16px 0 24px; }
.hc {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: center;
  height: 86px;
  padding: 0 18px;
  border: 0;
  border-radius: 16px;
  color: #16182a;
  text-align: left;
  font: 700 15px/1.25 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.hc:hover { transform: translateY(-3px); box-shadow: var(--sh); }
.hc b { display: block; max-width: 52%; position: relative; z-index: 1; }

const FALLBACK_MAP = new Map();
ONLINE_PHOTOS.forEach(p => { FALLBACK_MAP.set(p.url, p.fb); });

const STOCK = ONLINE_PHOTOS.map((p, idx) => ({
  cat: p.cat,
  title: p.title,
  tags: p.tags,
  src: p.url,
  fb: p.fb || FALLBACK_SVG[idx % FALLBACK_SVG.length]
}));

const STK_CATS = [
  ['all', 'All'],
  ['travel', 'Travel'],
  ['food', 'Food'],
  ['lifestyle', 'Lifestyle'],
  ['shopping', 'Shop'],
  ['nature', 'Nature'],
  ['urban', 'Urban'],
  ['workspace', 'Tech'],
  ['abstract', 'Art']
];
let stkCat = 'all', stkQ = '';

function renderStock() {
  const g = $('#stock');
  if (!g) return;
  const q = stkQ.trim().toLowerCase();
  const list = STOCK.map((item, idx) => ({ item, idx })).filter(({ item }) => {
    const matchCat = stkCat === 'all' || item.cat === stkCat;
    const matchQ = !q || (item.title + ' ' + item.tags + ' ' + item.cat).toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  g.innerHTML = list.length
    ? list.map(({ item, idx }) =>
        `<div class="stk-card" data-act="stock" data-i="${idx}" title="${esc(item.title)}">` +
        `<img src="${esc(item.src)}" alt="${esc(item.title)}" loading="lazy">` +
        `<span class="stk-lbl">${esc(item.title)}</span></div>`
      ).join('')
    : '<div style="grid-column:1/-1;color:var(--mute);font-size:11px;padding:8px 0">No matching pictures found.</div>';
}

function fallbackFor(src) {
  return FALLBACK_MAP.get(src) || FALLBACK_SVG[0];
}

document.addEventListener('error', ev => {
  const t = ev.target;
  if (t && t.tagName === 'IMG' && !t.dataset.fbApplied) {
    t.dataset.fbApplied = '1';
    t.src = fallbackFor(t.getAttribute('src') || '');
  }
}, true);

/* history + storage */
const snapJ = () => JSON.stringify(S);
function snap() {
  const j = snapJ();
  if (hist[hist.length - 1] === j) return;
  hist.push(j);
  if (hist.length > 80) hist.shift();
  fut = [];
}
function undo() {
  if (!hist.length) return;
  fut.push(snapJ());
  S = JSON.parse(hist.pop());
  sel = null;
  render();
  props();
  save();
}
function redo() {
  if (!fut.length) return;
  hist.push(snapJ());
  S = JSON.parse(fut.pop());
  sel = null;
  render();
  props();
  save();
}
function save() {
  try { localStorage.setItem('frame-doc', snapJ()); } catch (e) {}
  curP = curP || String(Date.now());
  saveProj();
}

/* rendering */
function imgBox(e) {
  return e.crp
    ? `position:absolute;left:${-e.cl / (1 - e.cl - e.cr) * 100}%;top:${-e.ct / (1 - e.ct - e.cb) * 100}%;width:${100 / (1 - e.cl - e.cr)}%;height:${100 / (1 - e.ct - e.cb)}%;object-fit:fill;`
    : 'width:100%;height:100%;object-fit:cover;';
}
function imgFx(e) {
  return `brightness(${e.bri ?? 100}%) contrast(${e.con ?? 100}%) saturate(${e.sat ?? 100}%) blur(${e.blur || 0}px) grayscale(${e.gry || 0}%) sepia(${e.sep || 0}%) hue-rotate(${e.hue || 0}deg)`;
}

function vis(e, d) {
  d.style.opacity = e.op;
  d.style.display = e.hide ? 'none' : '';
  d.style.filter = e.sh ? `drop-shadow(0 ${e.shy ?? 12}px ${e.shb ?? 18}px ${e.shc || '#000000'}99)` : '';
  d.style.mixBlendMode = e.bm || 'normal';
  if (e.type === 'text') {
    d.style.font = `${e.it ? 'italic ' : ''}${e.wt} ${e.fs}px/${e.lh || 1.2} "${e.font}",sans-serif`;
    d.style.textTransform = e.up ? 'uppercase' : '';
    d.style.textDecoration = e.ul ? 'underline' : '';
    d.style.webkitTextStroke = e.stw ? `${e.stw}px ${e.stc || '#000000'}` : '';
    d.style.color = e.col;
    d.style.textAlign = e.al;
    d.style.letterSpacing = e.ls + 'px';
    d.textContent = e.text;
  } else if (e.type === 'img') {
    d.style.overflow = 'hidden';
    d.style.clipPath = POLY[e.mask] ? poly(e.mask) : '';
    d.innerHTML = `<img src="${esc(e.src)}" draggable="false" style="${imgBox(e)}display:block;pointer-events:none;user-select:none;border-radius:${e.mask === 'ell' ? '50%' : e.rad + 'px'};filter:${imgFx(e)}">`;
  } else {
    d.style.background = e.g ? `linear-gradient(${e.ga ?? 135}deg,${e.fill},${e.fill2})` : e.fill;
    d.style.boxShadow = e.bw ? `inset 0 0 0 ${e.bw}px ${e.bc || '#000000'}` : '';
    if (e.pic) {
      const px = e.pox ?? 50, py = e.poy ?? 50;
      d.style.overflow = 'hidden';
      d.innerHTML = `<img src="${esc(e.pic)}" draggable="false" style="width:100%;height:100%;object-fit:cover;object-position:${px}% ${py}%;transform:scale(${(e.pz || 100) / 100});transform-origin:${px}% ${py}%;display:block;pointer-events:none">`;
    } else {
      d.style.overflow = '';
    }
    d.style.borderRadius = e.type === 'ell' ? '50%' : e.type === 'rect' ? e.rad + 'px' : '';
    d.style.clipPath = POLY[e.type] ? poly(e.type) : '';
  }
}

function place(e, d) {
  d = d || clip.querySelector(`[data-id="${e.id}"]`);
  if (!d) return;
  d.style.left = e.x + 'px';
  d.style.top = e.y + 'px';
  d.style.width = e.w + 'px';
  d.style.transform = `rotate(${e.r}deg) scale(${e.fx ? -1 : 1},${e.fy ? -1 : 1})`;
  if (e.type === 'text') {
    d.style.height = 'auto';
    e.h = d.offsetHeight;
  } else {
    d.style.height = e.h + 'px';
  }
}

function updSel() {
  const e = cur();
  if (!e || e.hide) { sb.style.display = 'none'; return; }
  sb.querySelectorAll('.h').forEach(h => h.style.display = (e.lock || ms.size > 1) ? 'none' : '');
  Object.assign(sb.style, {
    display: 'block', left: e.x + 'px', top: e.y + 'px',
    width: e.w + 'px', height: e.h + 'px', transform: `rotate(${e.r}deg)`
  });
}

function render() {
  if (sel === null) ms.clear();
  clip.innerHTML = '';
  st.style.width = S.w + 'px';
  st.style.height = S.h + 'px';
  clip.style.background = S.g2 ? `linear-gradient(${S.bga ?? 135}deg,${S.bg},${S.bg2 || '#ffffff'})` : S.bg;
  S.els.forEach(e => {
    const d = document.createElement('div');
    d.className = 'el ' + e.type;
    d.dataset.id = e.id;
    clip.appendChild(d);
    if (ms.has(e.id)) d.classList.add('ms');
    vis(e, d);
    place(e, d);
  });
  zoomApply();
  updSel();
  layers();
}

function zoomApply() {
  const w = $('#wrap');
  w.style.width = S.w * z + 'px';
  w.style.height = S.h * z + 'px';
  st.style.transform = `scale(${z})`;
  st.style.setProperty('--z', z);
  $('#zl').textContent = Math.round(z * 100) + '%';
}
function fit() {
  const v = $('#view');
  z = Math.max(.05, Math.min((v.clientWidth - 72) / S.w, (v.clientHeight - 72) / S.h, 1));
  zoomApply();
}
function setZ(v) { z = Math.min(3, Math.max(.05, v)); zoomApply(); }

/* layers + props */
function layers() {
  $('#layers').innerHTML = [...S.els].reverse().map(e =>
    `<div class="ly ${(e.id === sel || ms.has(e.id)) ? 'on' : ''}" data-id="${e.id}">` +
    `<b>${e.type === 'text' ? esc(e.text.slice(0, 18) || 'Text') : NAMES[e.type]}</b>` +
    `<button data-act="lyup" data-id="${e.id}" aria-label="Move up">↑</button>` +
    `<button data-act="lydn" data-id="${e.id}" aria-label="Move down">↓</button>` +
    `<button data-act="lylock" data-id="${e.id}" aria-label="Lock">${e.lock ? '🔒' : '🔓'}</button>` +
    `<button data-act="eye" data-id="${e.id}" aria-label="Toggle visibility">${e.hide ? 'Show' : 'Hide'}</button></div>`
  ).join('') || '<div style="color:var(--mute)">Nothing here yet. Add a shape, some text or pick a template.</div>';
}

const F = (l, h) => `<label class="f"><span>${l}</span>${h}</label>`;
const inp = (p, v, t = 'number', x = '') => `<input data-p="${p}" type="${t}" value="${esc(v)}" ${x}>`;
const chk = (p, v) => `<input data-p="${p}" type="checkbox" ${v ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--acc)">`;
const sl = (p, o, v) => `<select data-p="${p}">${o.map(x => `<option ${String(x) === String(v) ? 'selected' : ''}>${x}</option>`).join('')}</select>`;

function applyCrop(e, cl, cr, ct, cb) {
  const fw = e.w / (1 - e.cl - e.cr), fh = e.h / (1 - e.ct - e.cb);
  const fx = e.x - e.cl * fw, fy = e.y - e.ct * fh;
  e.cl = cl; e.cr = cr; e.ct = ct; e.cb = cb;
  e.w = Math.round(fw * (1 - cl - cr));
  e.h = Math.round(fh * (1 - ct - cb));
  e.x = Math.round(fx + cl * fw);
  e.y = Math.round(fy + ct * fh);
}
function scaleEl(e, k) {
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  e.w = Math.round(e.w * k);
  const nh = e.h * k;
  if (e.type === 'text') e.fs = e.fs * k;
  else e.h = Math.round(nh);
  e.x = Math.round(cx - e.w / 2);
  e.y = Math.round(cy - nh / 2);
}
function sizeUI(e) {
  const t = e.type === 'text';
  return '<h3>Size and position</h3>' +
    F('X', inp('x', Math.round(e.x))) +
    F('Y', inp('y', Math.round(e.y))) +
    F('Width', inp('w', Math.round(e.w))) +
    (t ? '' : F('Height', inp('h', Math.round(e.h)))) +
    (t ? '' : F('Lock ratio', chk('lr', e.lr))) +
    `<div class='row' style='margin-top:0'>${[50, 75, 125, 150, 200].map(p => `<button class='btn' data-act='sc-${p}'>${p}%</button>`).join('')}</div>` +
    `<div class='row'><button class='btn' data-act='fitc'>Fit canvas</button><button class='btn' data-act='fillc'>Fill canvas</button></div>`;
}
function fxRow() {
  return `<h3>Photo effects</h3><div class='row' style='margin-top:0'>${[['Original', 'original'], ['Vivid', 'vivid'], ['B&W', 'bw'], ['Sepia', 'sepia'], ['Fade', 'fade'], ['Cool', 'cool']].map(n => `<button class='btn' data-act='fx-${n[1]}'>${n[0]}</button>`).join('')}</div>`;
}
function cropUI(e) {
  if (!e.crp) return "<h3>Crop and cut</h3><div class='row' style='margin-top:0'><button class='btn' data-act='cropstart'>Crop image</button></div>";
  const sl2 = (k, l) => F(l, inp(k, Math.round((e[k] || 0) * 100), 'range', 'min="0" max="80"'));
  return '<h3>Crop and cut</h3>' + sl2('cl', 'Left') + sl2('cr', 'Right') + sl2('ct', 'Top') + sl2('cb', 'Bottom') +
    "<div class='row'><button class='btn' data-act='cropreset'>Reset crop</button><button class='btn' data-act='cutv'>Cut left / right</button><button class='btn' data-act='cuth'>Cut top / bottom</button></div>";
}
function picUI(e) {
  let h = '<h3>Picture inside shape</h3><div class="row" style="margin-top:0"><button class="btn" data-act="picset">' + (e.pic ? 'Replace image' : 'Set image') + '</button>' + (e.pic ? '<button class="btn" data-act="picdel">Remove</button>' : '') + '</div>';
  h += '<div style="display:flex;gap:6px;margin-top:8px"><input type="url" id="shape-pic-url" placeholder="Paste image link (https://...)" style="flex:1;min-width:0"><button type="button" class="btn" data-act="picset-url" style="flex:none">Set link</button></div>';
  if (e.pic) h += F('Zoom', inp('pz', e.pz || 100, 'range', 'min="100" max="400"')) + F('Position X', inp('pox', e.pox ?? 50, 'range', 'min="0" max="100"')) + F('Position Y', inp('poy', e.poy ?? 50, 'range', 'min="0" max="100"'));
  return h + '<div class="grid" style="grid-template-columns:repeat(5,1fr);margin-top:8px">' +
    STOCK.slice(0, 10).map((it, i) => `<img data-act="picstock" data-i="${i}" src="${esc(it.src)}" alt="${esc(it.title)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)">`).join('') +
    '</div><p style="color:var(--mute);font-size:11px">Tip: drop an image file onto any shape on the canvas.</p>';
}

function props() {
  const P = $('#props'), e = cur();
  if (ms.size > 1) { P.innerHTML = multiUI(); return; }
  if (!e) {
    P.innerHTML = '<h3>Canvas</h3>' +
      F('Width', inp('w', S.w)) + F('Height', inp('h', S.h)) +
      F('Color', inp('bg', S.bg, 'color')) + F('Gradient', chk('g2', S.g2)) +
      F('Second', inp('bg2', S.bg2 || '#ffffff', 'color')) +
      F('Angle', inp('bga', S.bga ?? 135, 'range', 'min="0" max="360"')) +
      F('Resize to', `<select id='mrz'>${[...$('#preset').options].map(o => `<option value='${o.value}'>${o.textContent}</option>`).join('')}</select>`) +
      '<div class="row"><button class="btn" data-act="mresize">Resize and scale content</button></div>' +
      '<p style="color:var(--mute)">Click an element to edit it. Double-click text to type directly. Shift while resizing keeps the ratio.</p>';
    return;
  }
  let h = `<h3>${NAMES[e.type]}</h3>`;
  if (e.type === 'text') {
    h += `<div class="row" style="margin-top:0;margin-bottom:8px"><button class="btn pri" data-act="edit-text" style="width:100%">Edit text on canvas</button></div>` +
      F('Text', `<textarea data-p="text" rows="3">${esc(e.text)}</textarea>`) +
      F('Font', sl('font', FONTS, e.font)) + F('Size', inp('fs', Math.round(e.fs))) +
      F('Weight', sl('wt', [400, 600, 700, 800], e.wt)) + F('Align', sl('al', ['left', 'center', 'right'], e.al)) +
      F('Color', inp('col', e.col, 'color')) + F('Spacing', inp('ls', e.ls, 'range', 'min="-5" max="30"')) +
      F('Line height', inp('lh', e.lh || 1.2, 'range', 'min="0.8" max="2" step="0.05"')) +
      F('Italic', chk('it', e.it)) + F('Underline', chk('ul', e.ul)) + F('Uppercase', chk('up', e.up)) +
      F('Outline', inp('stw', e.stw || 0, 'range', 'min="0" max="20"')) +
      F('Outline color', inp('stc', e.stc || '#000000', 'color'));
  } else if (e.type !== 'img') {
    h += F('Fill', inp('fill', e.fill, 'color')) + F('Gradient', chk('g', e.g)) +
      F('Second', inp('fill2', e.fill2, 'color')) +
      F('Angle', inp('ga', e.ga ?? 135, 'range', 'min="0" max="360"')) +
      F('Border', inp('bw', e.bw || 0, 'range', 'min="0" max="60"')) +
      F('Border color', inp('bc', e.bc || '#000000', 'color')) + picUI(e);
  }
  if (e.type === 'img') {
    h += F('Shape mask', `<select data-p="mask">${[['none', 'None'], ['ell', 'Circle'], ['tri', 'Triangle'], ['star', 'Star'], ['dia', 'Diamond'], ['hex', 'Hexagon'], ['pent', 'Pentagon'], ['heart', 'Heart'], ['burst', 'Burst']].map(m => `<option value="${m[0]}" ${(e.mask || 'none') === m[0] ? 'selected' : ''}>${m[1]}</option>`).join('')}</select>`);
    h += F('Brightness', inp('bri', e.bri ?? 100, 'range', 'min="40" max="180"')) +
      F('Contrast', inp('con', e.con ?? 100, 'range', 'min="40" max="180"')) +
      F('Saturate', inp('sat', e.sat ?? 100, 'range', 'min="0" max="200"')) +
      F('Blur', inp('blur', e.blur || 0, 'range', 'min="0" max="20"')) +
      F('Grayscale', inp('gry', e.gry || 0, 'range', 'min="0" max="100"')) +
      F('Sepia', inp('sep', e.sep || 0, 'range', 'min="0" max="100"')) +
      F('Hue', inp('hue', e.hue || 0, 'range', 'min="0" max="360"')) +
      fxRow() + cropUI(e) +
      '<div class="row"><button class="btn" data-act="replace">Replace image</button><button class="btn" data-act="fillc">Fill canvas</button></div>' +
      '<div style="display:flex;gap:6px;margin-top:8px"><input type="url" id="rep-img-url" placeholder="New image link (https://...)" style="flex:1;min-width:0"><button type="button" class="btn" data-act="replace-url" style="flex:none">Set link</button></div>';
  }
  if (e.type === 'rect' || e.type === 'img') h += F('Corners', inp('rad', e.rad, 'range', 'min="0" max="400"'));
  h += sizeUI(e) +
    F('Opacity', inp('op', e.op, 'range', 'min="0" max="1" step="0.01"')) +
    F('Rotate', inp('r', Math.round(e.r))) +
    F('Shadow', chk('sh', e.sh)) +
    F('Shadow blur', inp('shb', e.shb ?? 18, 'range', 'min="0" max="80"')) +
    F('Shadow Y', inp('shy', e.shy ?? 12, 'range', 'min="-40" max="80"')) +

function multiAct(a) {
  const L = S.els.filter(e => ms.has(e.id));
  if (L.length < 2) return;
  snap();
  if (a === 'mgroup') { const g = 'g' + Date.now(); L.forEach(e => e.grp = g); }
  else if (a === 'mungroup') { L.forEach(e => delete e.grp); }
  else if (a === 'mdel') { S.els = S.els.filter(e => !ms.has(e.id)); ms.clear(); sel = null; }
  else if (a === 'mdup') {
    const n = L.map(e => ({ ...e, id: uid++, x: e.x + 30, y: e.y + 30 })), g = L.some(e => e.grp) ? 'g' + Date.now() : null;
    n.forEach(e => { if (g && e.grp) e.grp = g; });
    S.els.push(...n); ms = new Set(n.map(e => e.id)); sel = n[0].id;
  } else {
    const x0 = Math.min(...L.map(e => e.x)), x1 = Math.max(...L.map(e => e.x + e.w));
    const y0 = Math.min(...L.map(e => e.y)), y1 = Math.max(...L.map(e => e.y + e.h));
    if (a === 'mal-l') L.forEach(e => e.x = x0);
    else if (a === 'mal-r') L.forEach(e => e.x = x1 - e.w);
    else if (a === 'mal-c') L.forEach(e => e.x = (x0 + x1) / 2 - e.w / 2);
    else if (a === 'mal-t') L.forEach(e => e.y = y0);
    else if (a === 'mal-b') L.forEach(e => e.y = y1 - e.h);
    else if (a === 'mal-m') L.forEach(e => e.y = (y0 + y1) / 2 - e.h / 2);
    else if (a === 'mdh' || a === 'mdv') {
      const h = a === 'mdh', s = [...L].sort((p, q) => h ? p.x - q.x : p.y - q.y);
      const tot = h ? x1 - x0 : y1 - y0, sz = s.reduce((t, e) => t + (h ? e.w : e.h), 0);
      const gap = (tot - sz) / (s.length - 1);
      let c = h ? x0 : y0;
      s.forEach(e => { if (h) e.x = c; else e.y = c; c += (h ? e.w : e.h) + gap; });
    }
  }
  render(); props(); save();
}

function loadImg(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const m = 1600, k = Math.min(1, m / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .9), im);
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function addImg(file) {
  loadImg(file, (src, im) => {
    const w = Math.round(Math.min(S.w * .6, im.width)), h = Math.round(w * im.height / im.width);
    add(N('img', { src, w, h, ...mid(w, h) }));
  });
}

function normalizeImgUrl(raw) {
  const u = String(raw || '').trim();
  if (!u) return '';
  if (/^(https?:\/\/|data:image\/)/i.test(u)) return u;
  if (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) return 'https://' + u;
  return '';
}

function addImgFromUrl(rawUrl, mode = 'add') {
  const url = normalizeImgUrl(rawUrl);
  if (!url) {
    showUrlMsg('সঠিক ইমেজ লিংক দিন (https://...)', true);
    return;
  }
  showUrlMsg('ছবি লোড হচ্ছে...');
  const im = new Image();
  im.onload = () => {
    const natW = im.naturalWidth || 800, natH = im.naturalHeight || 800;
    const e = cur();
    if (mode === 'replace' && e && e.type === 'img') {
      snap();
      e.src = url;
      e.crp = 0;
      render(); props(); save();
      showUrlMsg('ছবি আপডেট হয়েছে!');
    } else if (mode === 'shape' && e && e.type !== 'text' && e.type !== 'img') {
      snap();
      e.pic = url; e.pox = 50; e.poy = 50; e.pz = 100;
      render(); props(); save();
      showUrlMsg('শেপের ভেতরে ছবি যুক্ত হয়েছে!');
    } else {
      const w = Math.round(Math.min(S.w * .6, natW));
      const h = Math.max(40, Math.round(w * natH / natW));
      add(N('img', { src: url, w, h, ...mid(w, h) }));
      showUrlMsg('ক্যানভাসে ছবি যুক্ত হয়েছে!');
    }
  };
  im.onerror = () => {
    showUrlMsg('লিংক থেকে ছবি লোড করা যায়নি। সরাসরি ইমেজ URL দিন।', true);
  };
  im.src = url;
}

    ];
  } else if (l === 4) {
    els = [
      E('img', 0, 0, w, h, { src: p0 }),
      E('rect', 0, 0, w, h, { fill: '#0b0d17', op: .52 }),
      E('rect', w * .34, h * .16, w * .32, s * .06, { fill: c1, rad: R(s * .03) }),
      T(w * .34, h * .173, w * .32, s * .028, fg(c1), 'center'),
      H(w * .08, h * .3, w * .84, s * .125, '#ffffff', 'center'),
      B(w * .14, h * .3 + hh(s * .125) + s * .03, w * .72, s * .038, '#e2e8f0', 'center')
    ];
  } else {
    els = [
      E('img', 0, 0, w, h * .64, { src: p0 }),
      E('rect', 0, h * .58, w, h * .42, { fill: P[0], rad: R(s * .04) }),
      E('img', w - pad - s * .34, h * .44, s * .34, s * .34, { src: p1, rad: R(s * .03), sh: 1 }),
      T(pad * 1.2, h * .63, w * .52, s * .028, c1),
      H(pad * 1.2, h * .68, w * .56, s * .095, ink),
      B(pad * 1.2, Math.min(h - pad - s * .05, h * .68 + hh(s * .095) + s * .015), w * .56, s * .032, ink)
    ];
  }
  return { w, h, bg: P[0], els };
}

/* Extra photo & promo card layouts (6 styles) */
function gen5(ci, i) {
  const catEntry = CATS[ci] || CATS[0];
  const [, w, h, f, k, rawCp, , bd, srcIdx, photoSeed] = catEntry;
  const srcCat = (typeof srcIdx === 'number' && CATS[srcIdx]) ? CATS[srcIdx] : CATS[0];
  const cp = Array.isArray(rawCp) && rawCp.length
    ? rawCp
    : (Array.isArray(srcCat?.[5]) && srcCat[5].length ? srcCat[5] : [['New\nEdit', 'Curated photo template']]);
  const P = PAL2[(i * 2 + ci) % 8];
  const [hd, sb] = cp[i % cp.length];
  const s = Math.min(w, h), R = Math.round, ln = hd.split('\n').length;
  const wt = (f === 'Bebas Neue' || f === 'Anton') ? 400 : 800, l = i % 6;
  const base = typeof photoSeed === 'number' ? photoSeed : (ci * 7 + i);
  const p0 = STOCK[(base + i) % STOCK.length].src;
  const p1 = STOCK[(base + i + 1) % STOCK.length].src;
  const p2 = STOCK[(base + i + 3) % STOCK.length].src;
  const p3 = STOCK[(base + i + 5) % STOCK.length].src;
  const c1 = P[2], c2 = P[3], ink = P[1];
  const X = (x, y, ww, t, fs, col, al, o) => N('text', { x: R(x), y: R(y), w: R(ww), text: t, fs: R(fs), col, al: al || 'left', ...o });
  const H = (x, y, ww, fs, col, al) => X(x, y, ww, hd, fs * k, col, al, { font: f, wt });
  const B = (x, y, ww, fs, col, al) => X(x, y, ww, sb, fs, col, al, { wt: 600 });
  const T = (x, y, ww, fs, col, al) => X(x, y, ww, bd || 'EDIT', fs, col, al, { wt: 800, ls: 2.5 });
  const E = (t, x, y, a, b, o) => N(t, { x: R(x), y: R(y), w: R(a), h: R(b), ...o });
  const hh = fs => fs * k * 1.16 * ln;
  const pad = s * .05, gap = s * .02;
  let els;
  if (l === 0) {
    const gw = (w - pad * 2 - gap) / 2, gh = h * .34;
    els = [
      E('img', pad, pad, gw, gh, { src: p0, rad: R(s * .02) }),
      E('img', pad + gw + gap, pad, gw, gh, { src: p1, rad: R(s * .02) }),
      E('img', pad, pad + gh + gap, gw, gh, { src: p2, rad: R(s * .02) }),
      E('img', pad + gw + gap, pad + gh + gap, gw, gh, { src: p3, rad: R(s * .02) }),
      E('rect', pad, h - pad - hh(s * .085) - s * .06, w - pad * 2, hh(s * .085) + s * .06, { fill: c1, rad: R(s * .025) }),
      H(pad + s * .03, h - pad - hh(s * .085) - s * .04, w * .56, s * .085, fg(c1)),
      B(w * .6, h - pad - s * .07, w * .34, s * .03, fg(c1), 'right')
    ];
  } else if (l === 1) {
    els = [
      E('img', pad, pad, w * .56, h - pad * 2, { src: p0, rad: R(s * .025) }),
      E('img', pad + w * .56 + gap, pad, w - pad * 2 - w * .56 - gap, h * .42, { src: p1, rad: R(s * .025) }),
      E('rect', pad + w * .56 + gap, pad + h * .42 + gap, w - pad * 2 - w * .56 - gap, h - pad * 2 - h * .42 - gap, { fill: c2, rad: R(s * .025) }),
      T(pad + w * .58 + gap, pad + h * .44 + gap, w * .32, s * .026, fg(c2)),
      H(pad + w * .58 + gap, pad + h * .49 + gap, w * .34, s * .075, fg(c2)),
      B(pad + w * .58 + gap, Math.min(h - pad - s * .05, pad + h * .49 + gap + hh(s * .075) + s * .015), w * .34, s * .03, fg(c2))
    ];
  } else if (l === 2) {
    els = [
      E('img', 0, 0, w, h, { src: p0 }),
      E('rect', w * .07, h * .56, w * .86, h * .36, { fill: P[0], rad: R(s * .035), sh: 1 }),
      E('ell', w * .76, h * .48, s * .18, s * .18, { fill: c1, sh: 1 }),
      T(w * .76, h * .55, s * .18, s * .028, fg(c1), 'center'),
      H(w * .11, h * .61, w * .76, s * .095, ink),
      B(w * .11, Math.min(h * .88, h * .61 + hh(s * .095) + s * .015), w * .76, s * .032, ink)
    ];
  } else if (l === 3) {
    const bw = (w - pad * 2 - gap * 2) / 3, bh = h * .56;
    els = [
      E('img', pad, pad, bw, bh, { src: p0, rad: R(s * .02) }),
      E('img', pad + bw + gap, pad, bw, bh, { src: p1, rad: R(s * .02) }),
      E('img', pad + (bw + gap) * 2, pad, bw, bh, { src: p2, rad: R(s * .02) }),
      T(pad, pad + bh + s * .03, w - pad * 2, s * .028, c1, 'center'),
      H(pad, pad + bh + s * .07, w - pad * 2, s * .09, ink, 'center'),
      B(pad, Math.min(h - pad - s * .05, pad + bh + s * .08 + hh(s * .09)), w - pad * 2, s * .032, ink, 'center')
    ];
  } else if (l === 4) {
    els = [
      E('rect', 0, 0, w, h, { g: 1, fill: c1, fill2: c2 }),
      E('img', w * .12, h * .1, w * .76, h * .46, { src: p0, rad: R(s * .03), sh: 1 }),
      E('rect', w * .12, h * .6, w * .76, h * .3, { fill: '#ffffff', rad: R(s * .03), sh: 1 }),
      H(w * .16, h * .63, w * .68, s * .085, '#16182a', 'center'),
      B(w * .16, Math.min(h * .86, h * .63 + hh(s * .085) + s * .015), w * .68, s * .032, '#334155', 'center')
    ];
  } else {
    els = [
      E('img', 0, 0, w * .52, h, { src: p0 }),
      E('img', w * .52, 0, w * .48, h * .48, { src: p1 }),
      E('rect', w * .52, h * .48, w * .48, h * .52, { fill: c1 }),
      T(w * .56, h * .53, w * .4, s * .028, fg(c1)),
      H(w * .56, h * .58, w * .4, s * .08, fg(c1)),
      B(w * .56, Math.min(h - s * .06, h * .58 + hh(s * .08) + s * .02), w * .4, s * .032, fg(c1))
    ];
  }
  return { w, h, bg: P[0], els };
}

function thumb(D, ci, i) {

    vis(e, c);

/* Actions & Events */
function lg(x, w, h, deg, a, b) {
  const r = deg * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r);
  const L = (Math.abs(w * dx) + Math.abs(h * dy)) / 2, cx = w / 2, cy = h / 2;
  const g = x.createLinearGradient(cx - dx * L, cy - dy * L, cx + dx * L, cy + dy * L);
  g.addColorStop(0, a); g.addColorStop(1, b);
  return g;
}

  } else if (a === 'replace' && e && e.type === 'img') {

      item.x = Math.round(ox + item.x * k); item.y = Math.round(oy + item.y * k);

  ctx.innerHTML = ms.size > 1
    ? `<button data-act='mgroup'>Group</button><button data-act='mungroup'>Ungroup</button><button data-act='mdup'>Duplicate</button><button data-act='mdel'>Delete</button>`
    : `<button data-act='dup'>Duplicate</button><button data-act='front'>Bring to front</button><button data-act='back'>Send to back</button><button data-act='lock'>${e && e.lock ? 'Unlock' : 'Lock'}</button><button data-act='del'>Delete</button>`;
  ctx.style.display = 'block';
  ctx.style.left = Math.min(ev.clientX, innerWidth - 190) + 'px';
  ctx.style.top = Math.min(ev.clientY, innerHeight - 230) + 'px';
});
document.addEventListener('click', () => { ctx.style.display = 'none'; });

/* Home Page */
const ico = d => `<svg viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='${d}'/></svg>`;
const IC = {
  home: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  proj: 'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  tpl: 'M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z',
  ph: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4',
  txt: 'M5 6V4h14v2M12 4v16M9 20h6',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5'
};
const HM = $('#home'), ciOf = n => CATS.findIndex(c => c[0] === n);
const TINT = [
  ['#ffe3d6', '#ffc8b0'], ['#f3dcff', '#e0c3ff'], ['#ffdcec', '#ffc2dc'],
  ['#e6dcff', '#d3c4ff'], ['#ffe9c9', '#ffd59a'], ['#d8ecff', '#bcd9ff'],
  ['#ffd9d9', '#ffbcbc'], ['#d9f5ea', '#b9ead6'], ['#fbe0f5', '#f2c2e8'],
  ['#dfe3ff', '#c5ccff']
];
const HC = [
  ['Presentation', 'Presentation'], ['Instagram post', 'Instagram<br>Post'],
  ['Poster', 'Poster'], ['YouTube thumbnail', 'YouTube<br>Thumbnail'],
  ['Story', 'Story'], ['Facebook post', 'Facebook<br>Post'],
  ['Canva fashion lookbook', 'Canva<br>Lookbook'], ['Canva collage grid', 'Canva<br>Collage'],
  ['Bangla promo & sale', 'Bangla<br>Promo'], ['Canva new arrival & sale', 'New Arrival<br>& Sale']
].map(([n, l]) => ({ ci: ciOf(n), l })).filter(c => c.ci >= 0);
const DISC = Array.from({ length: 18 }, (_, k) => [(k * 5 + 68) % CATS.length, (k * 3) % 15]);
const th2 = (ci, i) => { const t = thumb(gen(ci, i), ci, i); delete t.dataset.act; return t; };

function showHome() { HM.style.display = 'flex'; renderProjs(); $('#cmenu').classList.remove('on'); $('#hmain').scrollTop = 0; }
function hideHome() { HM.style.display = 'none'; }
function openEd(ci, i) {
  curP = String(Date.now()); snap(); S = gen(ci, i); sel = null;
  render(); props(); hideHome(); $('#preset').selectedIndex = -1;
  $('#cat').value = ci; showCat(ci); fit(); save();
}
function blank(w, h) {
  curP = String(Date.now()); snap(); S = { w, h, bg: '#ffffff', els: [] }; sel = null;
  render(); props(); hideHome(); fit(); save();
}
function setRail(k) { HM.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', b.dataset.h === k)); }
function disc(list, title) {
  $('#hdt').innerHTML = title + (title === 'Discover Frame' ? '' : " <button id='hclr'>Clear</button>");
  $('#hdisc').replaceChildren(...list.map(([c, i]) => th2(c, i)));
}
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { disc(DISC, 'Discover Frame'); return; }
  const r = [];
  CATS.forEach((c, ci) => {
    const srcCat = (typeof c[8] === 'number' && CATS[c[8]]) ? CATS[c[8]] : CATS[0];
    const cp = (c[6] === 2 || c[6] === 4 || c[6] === 5) ? srcCat[5] : c[5];
    if (!Array.isArray(cp) || !cp.length) return;
    for (let i = 0; i < 15; i++) {
      const t = (c[0] + ' ' + cp[i % cp.length].join(' ') + ' ' + (c[7] || '')).toLowerCase().replace(/\n/g, ' ');
      if (t.includes(q)) r.push([ci, i]);
    }
  });
  disc(r.slice(0, 24), r.length ? `Results for “${q}” (${r.length})` : `No templates found for “${q}”`);
}

const CHIP = {
  biz: [/business|linkedin|presentation|certificate|email|tech|real estate|product|startup|bangla business|arch|desk|agency|work/i, 'Business templates'],
  video: [/youtube|story|podcast|music/i, 'Video and cover templates'],
  social: [/instagram|facebook|pinterest|carousel|twitter|quote|fashion|food|travel|bangla|cafe|restaurant|retail|e-commerce|photo|wellness|shop|bakery|canva|lookbook|collage|arrival|morning|skincare|ootd|deal/i, 'Social media & Canva templates']
};

const FL = [
  [68, 0, 'left:0;top:70px;width:36%;transform:rotate(-8deg)'],
  [69, 1, 'left:27%;top:0;width:44%;transform:rotate(3deg);z-index:2'],
  [70, 2, 'right:0;top:120px;width:34%;transform:rotate(8deg)']
];

HM.innerHTML = `<div id='hmain'>
<section id='hero'>
<header id='hnav'>
  <div class='hlogo' data-h='home'><i></i>Frame</div>
  <button class='rb on' data-h='home'>${ico(IC.home)}Home</button>
  <button class='rb' data-h='tpl'>${ico(IC.tpl)}Templates</button>
  <button class='rb' data-h='ph'>${ico(IC.ph)}Photos</button>
  <button class='rb' data-h='txt'>${ico(IC.txt)}Text</button>
  <button class='rb' data-h='proj'>${ico(IC.proj)}Projects</button>
  <button class='rb' data-act='theme'>Theme</button>
  <button class='rb mk' data-h='create'><i>+</i>New design</button>
</header>
<div class='hgrid'>
  <div class='hl'>
    <span class='htag'>${CATS.length * 15} ready-made designs · ${STOCK.length} curated photos</span>
    <h1 id='hh'>Make it <em>yours</em>,<br>in minutes.</h1>
    <p class='hsubp'>Pick a template, swap the words and photos, then export. Works offline with instant image fallback.</p>
    <label id='hsearch'>${ico(IC.search)}<input id='hq' type='text' placeholder='Try: sale, bangla, photo, cafe, travel, quote'><button type='button' id='hgo'>Search</button></label>
    <div id='hchips'>
      <span class='hlab'>Browse</span>
      <button class='chip' data-k='biz'><i style='background:#14b8a6'></i>Business</button>
      <button class='chip' data-k='video'><i style='background:#8b5cf6'></i>Video</button>
      <button class='chip' data-k='social'><i style='background:#ef4444'></i>Social &amp; Photo</button>
    </div>
    <button class='hlink' id='hcont'>Continue editing &rarr;</button>
  </div>
  <div id='hfloat'></div>
</div>
</section>
<section class='hsec' id='hprojs'></section>
<section class='hsec'><h2 id='hex'>Start with a size</h2><p class='hsub'>Every category comes with 15 ready designs (${CATS.length * 15} templates total).</p><div id='hcards'></div></section>
<section class='hsec'><h2 id='hdt'>Discover Frame</h2><div id='hdisc'></div></section>
</div>
<div id='cmenu'>${[...$('#preset').options].map(o => { const [n, z2] = o.textContent.split(' · '); return `<button data-wh='${o.value}'><span>${n}</span><small>${z2}</small></button>`; }).join('')}</div>`;

$('#hfloat').replaceChildren(...FL.map(([c, i, st]) => { const d = document.createElement('div'); d.className = 'fc'; d.style.cssText = st; d.appendChild(th2(c, i)); return d; }));
$('#hcards').replaceChildren(...HC.map((c, k) => {
  const b = document.createElement('button'); b.className = 'hc'; b.dataset.ci = c.ci; b.dataset.i = k % 5;
  b.style.background = `linear-gradient(135deg,${TINT[k][0]},${TINT[k][1]})`;
  b.innerHTML = `<b>${c.l}</b><div class='pv'></div>`;
  b.querySelector('.pv').appendChild(th2(c.ci, k % 5));
  return b;
}));
disc(DISC, 'Discover Frame');

const goS = () => { doSearch($('#hq').value); $('#hdt').scrollIntoView({ behavior: 'smooth' }); };
$('#hq').oninput = e => doSearch(e.target.value);
$('#hq').onkeydown = e => { if (e.key === 'Enter') goS(); };
$('#hgo').onclick = goS;
$('#hcont').onclick = hideHome;

HM.addEventListener('click', ev => {
  const t = ev.target, hc = t.closest('.hc');
  if (!t.closest('#cmenu') && !t.closest('.rb.mk')) $('#cmenu').classList.remove('on');
  if (hc) {
    const ci = +hc.dataset.ci;
    const list = [];
    const sorted = [...CATS.keys()].sort((a, b) => {
      if (a === ci) return -1;
      if (b === ci) return 1;
      return CATS[a][0].localeCompare(CATS[b][0], undefined, { sensitivity: 'base' });
    });
    sorted.forEach(cIdx => { for (let i = 0; i < 15; i++) list.push([cIdx, i]); });
    disc(list, `${CATS[ci][0]} + A–Z All Categories (${list.length})`);
    $('#hdt').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  const pj = t.closest('.pj');
  if (pj) {
    if (t.closest('[data-del]')) { delProj(t.closest('[data-del]').dataset.del); return; }
    openProj(pj.dataset.id); return;
  }
  const th = t.closest('.th');
  if (th) { openEd(+th.dataset.c, +th.dataset.i); return; }
  const cm = t.closest('#cmenu button');
  if (cm) { const [w, h] = cm.dataset.wh.split(',').map(Number); blank(w, h); return; }
  if (t.closest('#hclr')) { $('#hq').value = ''; disc(DISC, 'Discover Frame'); return; }
  const ch = t.closest('.chip');
  if (ch) {
    const [re, title] = CHIP[ch.dataset.k], l = [], rest = [];
    const sorted = [...CATS.keys()].sort((a, b) => CATS[a][0].localeCompare(CATS[b][0], undefined, { sensitivity: 'base' }));
    sorted.forEach(cIdx => {
      for (let i = 0; i < 15; i++) {
        if (re.test(CATS[cIdx][0])) l.push([cIdx, i]);
        else rest.push([cIdx, i]);
      }
    });
    disc([...l, ...rest], `${title} + A–Z All (${l.length + rest.length})`);
    $('#hdt').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  const hb = t.closest('[data-h]');
  if (!hb) return;
  const k = hb.dataset.h;
  if (k === 'create') { $('#cmenu').classList.toggle('on'); return; }
  if (k === 'home') { $('#hmain').scrollTo({ top: 0, behavior: 'smooth' }); setRail('home'); return; }
  if (k === 'tpl') { $('#hex').scrollIntoView({ behavior: 'smooth' }); setRail('tpl'); return; }
  if (k === 'proj') {
    renderProjs();
    const pe = $('#hprojs');
    (pe.style.display === 'none' ? $('#hex') : pe).scrollIntoView({ behavior: 'smooth' });
    setRail('proj');
    return;
  }
  hideHome();
  if (k === 'ph' || k === 'txt') document.querySelector(`#tabs [data-tab='${k === 'ph' ? 'ph' : 'tx'}']`).click();
});

/* Parallax + scroll reveal */
(() => {
  const hero = $('#hero'), f = $('#hfloat');
  hero.addEventListener('pointermove', e => {
    const r = hero.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    f.style.setProperty('--px', x * -28 + 'px');
    f.style.setProperty('--py', y * -20 + 'px');
    f.style.setProperty('--pr', x * -2 + 'deg');
  });
  hero.addEventListener('pointerleave', () => {
    f.style.setProperty('--px', '0px'); f.style.setProperty('--py', '0px'); f.style.setProperty('--pr', '0deg');
  });
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); }
  }), { root: $('#hmain'), threshold: .05 });
  const watch = (n, k) => { n.style.transitionDelay = (k % 4) * 70 + 'ms'; n.classList.add('rv'); io.observe(n); };
  $('#hcards').querySelectorAll('.hc').forEach(watch);
  $('#hdisc').querySelectorAll('.th').forEach(watch);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach((n, k) => { if (n.nodeType === 1) watch(n, k); }))).observe($('#hdisc'), { childList: true });
})();

/* Boot */
try {
  const j = localStorage.getItem('frame-doc');
  if (j) { const d = JSON.parse(j); if (d && d.els) { S = d; uid = Math.max(0, ...S.els.map(e => e.id)) + 1; } }
} catch (e) {}
if (!S.els.length) { S = TPL[0][2](); }
render(); fit(); props(); renderProjs();
</script>
</body>
</html>
